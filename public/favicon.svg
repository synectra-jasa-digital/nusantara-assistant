<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00658D" />
      <stop offset="50%" stop-color="#0087B8" />
      <stop offset="100%" stop-color="#00BAFF" />
    </linearGradient>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEB700" />
      <stop offset="100%" stop-color="#FF9249" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#004C6B" flood-opacity="0.35" />
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bg-grad)" filter="url(#shadow)" />

  <!-- Inner Subtle Glass Glow Overlay -->
  <rect x="32" y="32" width="448" height="224" rx="112" fill="#FFFFFF" fill-opacity="0.08" />

  <!-- Outer Orbit Segment 1 (BMKG Weather / Wave) -->
  <path d="M 256 112 A 144 144 0 0 1 400 256" fill="none" stroke="url(#ring-grad)" stroke-width="32" stroke-linecap="round" />
  
  <!-- Outer Orbit Segment 2 (BPS / Data Arc) -->
  <path d="M 400 256 A 144 144 0 0 1 256 400" fill="none" stroke="url(#ring-grad)" stroke-width="32" stroke-linecap="round" opacity="0.85" />

  <!-- Outer Orbit Segment 3 (BI / Currency Arc) -->
  <path d="M 256 400 A 144 144 0 0 1 128 288" fill="none" stroke="url(#ring-grad)" stroke-width="32" stroke-linecap="round" opacity="0.6" />

  <!-- Core AI Data Node -->
  <circle cx="256" cy="256" r="48" fill="url(#core-grad)" filter="url(#glow)" />
  
  <!-- Central Spark Overlay -->
  <circle cx="256" cy="256" r="20" fill="#FFFFFF" opacity="0.9" />

  <!-- Satellite Nodes (4 Data Pillars: BMKG, BI, Wilayah, BPS) -->
  <circle cx="256" cy="112" r="16" fill="#FFFFFF" />
  <circle cx="400" cy="256" r="16" fill="#FFFFFF" />
  <circle cx="256" cy="400" r="16" fill="#FFFFFF" />
  <circle cx="128" cy="288" r="14" fill="#FFFFFF" />
</svg>
